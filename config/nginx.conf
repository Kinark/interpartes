server {
    listen       8080;
    absolute_redirect off;
    server_name  localhost;
    access_log   off;

    root   /app;
    gzip_static on;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=30, stale-while-revalidate=30";
    }

    # Guest-only: no login/register UI
    location = /login    { return 302 /; }
    location = /register { return 302 /; }

    # config/index.html: the upstream release's index.html plus the guest-only
    # CSS and the /chat/inject.js tag (see verify/verify.mjs for the exact diff).
    location = /index.html {
        gzip_static off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /assets {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /apple-app-site-association {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
