# Sent with every Element Call response (nginx drops server-level add_header
# lines in any location that sets its own, so each location includes this).
#
# connect-src only allows this origin: even if analytics or crash reporting
# were switched on (config or ?posthogApiHost= / ?sentryDsn= / ?rageshakeSubmitUrl=
# in a link), the browser refuses to send anything elsewhere.
# The two script hashes are Element Call's own inline scripts in index.html.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-pQY0fuQAnnVQH5nQfjo80rzGkQzeN3JeAtAJ+1KcD4k=' 'sha256-3042zLa3JXvrJe/2n8P/XpIKwqBdNTu7fwbLZUNrzZQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://interpartes.lo.fi data: blob:; worker-src 'self' blob:; frame-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
